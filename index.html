<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Hub - Primary School English</title>
    <!-- Google Fonts untuk font ceria -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-yellow: #FFDE59;
            --primary-pink: #FF66C4;
            --primary-blue: #5CE1E6;
            --primary-green: #7ED957;
            --primary-purple: #C38FFF;
            --text-dark: #2C3E50;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #a8edd8 0%, #h8d7ff 100%);
            background-color: #E0F7FA;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--white);
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            text-align: center;
            border: 5px solid var(--primary-yellow);
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            color: #FF5757;
            text-shadow: 2px 2px var(--primary-yellow);
            margin-bottom: 5px;
        }

        header p {
            font-size: 1.1rem;
            font-weight: 700;
            color: #5E17EB;
            margin-bottom: 20px;
        }

        .user-bar {
            background: #F0F4F8;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .change-user-btn {
            background: #FF5757;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 700;
        }

        .card {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .card.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Input Profil */
        .input-group {
            margin: 20px 0;
        }

        .name-input {
            width: 80%;
            padding: 12px 20px;
            font-size: 1.2rem;
            border: 3px solid var(--primary-blue);
            border-radius: 15px;
            text-align: center;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            outline: none;
        }

        .name-input:focus {
            border-color: var(--primary-pink);
        }

        /* Menu Skrin Utama */
        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .topic-btn {
            background-color: var(--primary-blue);
            color: var(--text-dark);
            border: none;
            padding: 18px 15px;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 #3bafb3;
            font-family: 'Quicksand', sans-serif;
        }

        .topic-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #3bafb3;
        }

        .topic-btn:nth-child(2n) { background-color: var(--primary-pink); box-shadow: 0 5px 0 #c74597; color: white;}
        .topic-btn:nth-child(2n):hover { box-shadow: 0 8px 0 #c74597; }
        
        .topic-btn:nth-child(3n) { background-color: var(--primary-green); box-shadow: 0 5px 0 #5aa33d; }
        .topic-btn:nth-child(3n):hover { box-shadow: 0 8px 0 #5aa33d; }

        .topic-btn:nth-child(4n) { background-color: var(--primary-purple); box-shadow: 0 5px 0 #8d5cc4; color: white;}
        .topic-btn:nth-child(4n):hover { box-shadow: 0 8px 0 #8d5cc4; }

        /* Skrin Soalan */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 700;
            background: #FFF9C4;
            padding: 10px 20px;
            border-radius: 15px;
        }

        .question-box {
            font-size: 1.3rem;
            font-weight: 700;
            margin: 25px 0;
            padding: 15px;
            background-color: #F0F4F8;
            border-radius: 15px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #FFFFFF;
            border: 3px solid #CBD5E1;
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Quicksand', sans-serif;
        }

        .option-btn:hover {
            border-color: var(--primary-blue);
            background-color: #E0F7FA;
        }

        .option-btn.correct {
            background-color: var(--primary-green) !important;
            border-color: #4CAF50 !important;
            color: white;
        }

        .option-btn.wrong {
            background-color: #FF6B6B !important;
            border-color: #E53935 !important;
            color: white;
        }

        .action-btn {
            background-color: #FF9800;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 0 #E65100;
            margin: 10px auto;
        }

        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #E65100;
        }

        /* Skrin Keputusan & Rekod */
        .result-score {
            font-size: 3rem;
            font-family: 'Fredoka One', cursive;
            color: #5E17EB;
            margin: 15px 0;
        }

        .record-table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
            background: #FFFDE7;
            border-radius: 12px;
            overflow: hidden;
        }

        .record-table th, .record-table td {
            padding: 10px;
            border: 1px solid #FFE082;
            font-size: 0.95rem;
        }

        .record-table th {
            background-color: var(--primary-yellow);
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🌟 Grammar Hub 🌟</h1>
            <p>English KSSR Primary School</p>
            <div id="user-display" class="user-bar" style="display:none;">
                👤 Student: <span id="current-username" style="color:#5E17EB;">-</span>
                <button class="change-user-btn" onclick="playClickSound(); changeUser()">Switch Profile</button>
            </div>
        </header>

        <!-- SKRIN DAFTAR NAMA -->
        <div id="profile-screen" class="card active">
            <h2>Welcome! 👋</h2>
            <p style="margin-top: 10px;">Please enter your name to start:</p>
            <div class="input-group">
                <input type="text" id="username-input" class="name-input" placeholder="Type your name here..." maxlength="20">
            </div>
            <button class="action-btn" style="display:inline-block;" onclick="playClickSound(); registerUser()">Start Learning 🚀</button>
        </div>

        <!-- SKRIN UTAMA (MENU TOPIK & REKOD) -->
        <div id="home-screen" class="card">
            <h2 style="margin-bottom: 10px; color: #333;">Choose a Topic! 📚</h2>
            <div class="topic-grid">
                <button class="topic-btn" onclick="playClickSound(); startQuiz('nouns')">Nouns 🍎</button>
                <button class="topic-btn" onclick="playClickSound(); startQuiz('pronouns')">Pronouns 👦👧</button>
                <button class="topic-btn" onclick="playClickSound(); startQuiz('verbs')">Verbs 🏃‍♂️</button>
                <button class="topic-btn" onclick="playClickSound(); startQuiz('adjectives')">Adjectives 🎨</button>
                <button class="topic-btn" onclick="playClickSound(); startQuiz('prepositions')">Prepositions 📦</button>
                <button class="topic-btn" onclick="playClickSound(); startQuiz('conjunctions')">Conjunctions 🔗</button>
            </div>

            <!-- JADUAL REKOD SKOR -->
            <h3 style="margin-top: 25px; color: #333;">🏆 My Highest Scores</h3>
            <table class="record-table">
                <thead>
                    <tr>
                        <th>Topic</th>
                        <th>Best Score</th>
                    </tr>
                </thead>
                <tbody id="score-records-body">
                    <!-- Rekod dimuatkan melalui JS -->
                </tbody>
            </table>
        </div>

        <!-- SKRIN SOALAN -->
        <div id="quiz-screen" class="card">
            <div class="quiz-header">
                <span id="topic-title">Topic</span>
                <span>Question: <span id="question-num">1</span>/10</span>
                <span>Score: <span id="current-score">0</span></span>
            </div>

            <div id="question-text" class="question-box">
                Question content goes here...
            </div>

            <div id="options-container" class="options-grid">
                <!-- Pilihan jawapan -->
            </div>

            <button id="next-btn" class="action-btn" style="display:none;" onclick="playClickSound(); nextQuestion()">Next Question ➔</button>
        </div>

        <!-- SKRIN KEPUTUSAN -->
        <div id="result-screen" class="card">
            <h2>Awesome Job! 🎉</h2>
            <p>You have completed the quiz!</p>
            <div class="result-score" id="final-score">0 / 10</div>
            <p id="feedback-message" style="font-weight: 700; color: #555;"></p>
            <button class="action-btn" style="display:inline-block;" onclick="playClickSound(); goHome()">Back to Menu 🔄</button>
        </div>
    </div>

    <script>
        // --- SISTEM BUNYI (WEB AUDIO API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playCorrectSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'triangle';
            osc1.frequency.setValueAtTime(523.25, now); 
            gain1.gain.setValueAtTime(0.3, now);
            gain1.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(now);
            osc1.stop(now + 0.15);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(659.25, now + 0.1); 
            gain2.gain.setValueAtTime(0.3, now + 0.1);
            gain2.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(now + 0.1);
            osc2.stop(now + 0.3);
        }

        function playWrongSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(130, now + 0.25);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
        }

        // Bank Soalan KSSR
        const questionBank = {
            nouns: [
                { q: "My father drives a new ________ to work.", options: ["car", "cars", "caring", "cared"], answer: 0 },
                { q: "There are three ________ in the cage.", options: ["bird", "birds", "birdies", "birding"], answer: 1 },
                { q: "Encik Ahmad is a hardworking ________.", options: ["teacher", "teachers", "teaching", "taught"], answer: 0 },
                { q: "I need to brush my ________ every night.", options: ["tooth", "teeth", "tooths", "teethes"], answer: 1 },
                { q: "The ________ is barking loudly at the cat.", options: ["dog", "dogs", "doggy", "dogging"], answer: 0 },
                { q: "She bought two ________ of bread from the bakery.", options: ["loaf", "loaves", "loafs", "loafes"], answer: 1 },
                { q: "Kuala Lumpur is a big ________.", options: ["city", "cities", "citys", "citing"], answer: 0 },
                { q: "All the ________ are playing in the field.", options: ["child", "children", "childs", "childrens"], answer: 1 },
                { q: "Put the books on the ________, please.", options: ["table", "tables", "tabling", "tabled"], answer: 0 },
                { q: "Five ________ are swimming in the pond.", options: ["goose", "geese", "gooses", "geeses"], answer: 1 }
            ],
            pronouns: [
                { q: "Aina is hungry. ________ wants to eat a burger.", options: ["He", "She", "It", "They"], answer: 1 },
                { q: "Ali and Adam are brothers. ________ like to play football.", options: ["We", "They", "He", "You"], answer: 1 },
                { q: "My name is Danial. ________ am eight years old.", options: ["I", "You", "We", "He"], answer: 0 },
                { q: "The cat is sleeping because ________ is tired.", options: ["she", "he", "it", "they"], answer: 2 },
                { q: "My mother made cake for ________ because it is my birthday.", options: ["me", "I", "my", "mine"], answer: 0 },
                { q: "This is Mei Ling's bag. It belongs to ________.", options: ["him", "her", "she", "his"], answer: 1 },
                { q: "Are ________ coming to my house tomorrow?", options: ["you", "he", "she", "it"], answer: 0 },
                { q: "We are classmates. Miss Lee teaches ________ English.", options: ["them", "us", "we", "our"], answer: 1 },
                { q: "The boys finished ________ homework early.", options: ["their", "his", "her", "its"], answer: 0 },
                { q: "The dog wagged ________ tail happily.", options: ["it", "it's", "its", "their"], answer: 2 }
            ],
            verbs: [
                { q: "The pupils ________ to school every morning.", options: ["walk", "walks", "walking", "walked"], answer: 0 },
                { q: "Siti ________ a song gracefully yesterday.", options: ["sing", "sings", "sang", "singing"], answer: 2 },
                { q: "Listen! The baby is ________ in the bedroom.", options: ["crying", "cried", "cries", "cry"], answer: 0 },
                { q: "My uncle ________ a big fish last weekend.", options: ["catch", "catches", "caught", "catching"], answer: 2 },
                { q: "He ________ his teeth twice a day.", options: ["brush", "brushes", "brushed", "brushing"], answer: 1 },
                { q: "Birds ________ in the sky.", options: ["fly", "flies", "flying", "flew"], answer: 0 },
                { q: "Mother ________ delicious fried rice this morning.", options: ["cook", "cooks", "cooked", "cooking"], answer: 2 },
                { q: "They ________ swimming in the pool right now.", options: ["is", "are", "was", "were"], answer: 1 },
                { q: "Raju ________ a funny story to his friends.", options: ["told", "tell", "tells", "telling"], answer: 0 },
                { q: "Please ________ your shoes before entering.", options: ["remove", "removes", "removed", "removing"], answer: 0 }
            ],
            adjectives: [
                { q: "An elephant is a ________ animal.", options: ["huge", "small", "tiny", "short"], answer: 0 },
                { q: "Ice cream is ________ and sweet.", options: ["hot", "cold", "spicy", "warm"], answer: 1 },
                { q: "Cheetah is the ________ land animal.", options: ["fast", "faster", "fastest", "more fast"], answer: 2 },
                { q: "This knife is very ________. Be careful!", options: ["sharp", "blunt", "soft", "smooth"], answer: 0 },
                { q: "My grandfather is ________, but he is still strong.", options: ["young", "old", "new", "fresh"], answer: 1 },
                { q: "She wore a ________ dress to the party.", options: ["beautiful", "beauty", "beautify", "more beautiful"], answer: 0 },
                { q: "The box is too ________ for me to carry.", options: ["light", "heavy", "soft", "thin"], answer: 1 },
                { q: "A giraffe has a ________ neck.", options: ["short", "long", "small", "broad"], answer: 1 },
                { q: "Lemon juice tastes ________.", options: ["sour", "sweet", "salty", "bitter"], answer: 0 },
                { q: "This riddle is ________ than the first one.", options: ["easy", "easier", "easiest", "more easy"], answer: 1 }
            ],
            prepositions: [
                { q: "The cat is sleeping ________ the table.", options: ["under", "in", "above", "between"], answer: 0 },
                { q: "We go to school ________ 7.00 a.m.", options: ["on", "at", "in", "by"], answer: 1 },
                { q: "Put the apples ________ the basket.", options: ["inside", "on", "over", "between"], answer: 0 },
                { q: "The sun shines ________ our heads at noon.", options: ["under", "above", "in", "behind"], answer: 1 },
                { q: "My birthday is ________ July.", options: ["at", "on", "in", "to"], answer: 2 },
                { q: "She hangs the clock ________ the wall.", options: ["on", "in", "under", "at"], answer: 0 },
                { q: "The boy is standing ________ his mother and father.", options: ["among", "between", "under", "in"], answer: 1 },
                { q: "They walk ________ the bridge to cross the river.", options: ["across", "under", "into", "at"], answer: 0 },
                { q: "The train arrived ________ Sunday morning.", options: ["in", "at", "on", "from"], answer: 2 },
                { q: "He hid ________ the door during hide and seek.", options: ["behind", "on", "in", "over"], answer: 0 }
            ],
            conjunctions: [
                { q: "I like apples ________ oranges.", options: ["and", "but", "or", "so"], answer: 0 },
                { q: "He is rich ________ he is not happy.", options: ["and", "but", "so", "or"], answer: 1 },
                { q: "Do you want tea ________ coffee?", options: ["and", "but", "or", "so"], answer: 2 },
                { q: "She stayed home ________ she was feeling sick.", options: ["because", "but", "or", "and"], answer: 0 },
                { q: "It started to rain, ________ we took out our umbrellas.", options: ["because", "so", "but", "or"], answer: 1 },
                { q: "Abu is tall ________ his brother is short.", options: ["and", "or", "but", "because"], answer: 2 },
                { q: "You can play video games ________ you finish your homework.", options: ["after", "but", "or", "so"], answer: 0 },
                { q: "Wash your hands ________ you eat your meal.", options: ["before", "but", "so", "or"], answer: 0 },
                { q: "He ran fast, ________ he missed the bus.", options: ["and", "but", "so", "because"], answer: 1 },
                { q: "Is the answer true ________ false?", options: ["and", "but", "or", "so"], answer: 2 }
            ]
        };

        // Pembolehubah Aplikasi
        let currentUser = "";
        let currentTopic = "";
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let canAnswer = true;

        // Semak profil pada awal pemuatan
        window.onload = function() {
            const savedUser = localStorage.getItem("grammar_hub_active_user");
            if (savedUser) {
                currentUser = savedUser;
                showHomeScreen();
            } else {
                showScreen("profile-screen");
            }
        };

        // Pendaftaran Profil
        function registerUser() {
            const inputName = document.getElementById("username-input").value.trim();
            if (inputName === "") {
                alert("Please enter your name first!");
                return;
            }
            currentUser = inputName;
            localStorage.setItem("grammar_hub_active_user", currentUser);
            showHomeScreen();
        }

        function changeUser() {
            localStorage.removeItem("grammar_hub_active_user");
            document.getElementById("username-input").value = "";
            document.getElementById("user-display").style.display = "none";
            showScreen("profile-screen");
        }

        function showHomeScreen() {
            document.getElementById("current-username").innerText = currentUser;
            document.getElementById("user-display").style.display = "inline-flex";
            loadScoreBoard();
            showScreen("home-screen");
        }

        // Papan Rekod Skor Menggunakan LocalStorage
        function loadScoreBoard() {
            const tbody = document.getElementById("score-records-body");
            tbody.innerHTML = "";
            
            const topics = ['nouns', 'pronouns', 'verbs', 'adjectives', 'prepositions', 'conjunctions'];
            const userScores = JSON.parse(localStorage.getItem(`grammar_hub_scores_${currentUser}`)) || {};

            topics.forEach(tp => {
                const tr = document.createElement("tr");
                const topScore = userScores[tp] !== undefined ? `${userScores[tp]} / 10` : "-";
                tr.innerHTML = `
                    <td style="text-transform: capitalize; font-weight:700;">${tp}</td>
                    <td style="font-weight:700; color:#5E17EB;">${topScore}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function saveScore(topic, newScore) {
            let userScores = JSON.parse(localStorage.getItem(`grammar_hub_scores_${currentUser}`)) || {};
            if (userScores[topic] === undefined || newScore > userScores[topic]) {
                userScores[topic] = newScore;
                localStorage.setItem(`grammar_hub_scores_${currentUser}`, JSON.stringify(userScores));
            }
        }

        // Rawakkan Array Soalan
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Jalankan Sesi Kuiz
        function startQuiz(topic) {
            currentTopic = topic;
            currentQuestions = shuffle([...questionBank[topic]]);
            currentQuestionIndex = 0;
            score = 0;

            document.getElementById('topic-title').innerText = topic.toUpperCase();
            document.getElementById('current-score').innerText = score;

            showScreen('quiz-screen');
            loadQuestion();
        }

        function loadQuestion() {
            canAnswer = true;
            document.getElementById('next-btn').style.display = 'none';
            
            const qData = currentQuestions[currentQuestionIndex];
            document.getElementById('question-num').innerText = currentQuestionIndex + 1;
            document.getElementById('question-text').innerText = qData.q;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (!canAnswer) return;
            canAnswer = false;

            const qData = currentQuestions[currentQuestionIndex];
            const allBtns = document.querySelectorAll('.option-btn');

            if (selectedIndex === qData.answer) {
                btnElement.classList.add('correct');
                playCorrectSound();
                score++;
                document.getElementById('current-score').innerText = score;
            } else {
                btnElement.classList.add('wrong');
                playWrongSound();
                allBtns[qData.answer].classList.add('correct');
            }

            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            saveScore(currentTopic, score); // Simpan rekod secara automatik
            showScreen('result-screen');
            document.getElementById('final-score').innerText = `${score} / 10`;

            const feedback = document.getElementById('feedback-message');
            if (score === 10) {
                feedback.innerText = "🌟 Outstanding! Perfect Score! 🌟";
            } else if (score >= 7) {
                feedback.innerText = "👍 Great Job! Keep it up!";
            } else if (score >= 5) {
                feedback.innerText = "😊 Good try! You can do better!";
            } else {
                feedback.innerText = "💪 Don't give up! Try again!";
            }
        }

        function goHome() {
            showHomeScreen();
        }

        function showScreen(screenId) {
            document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }
    </script>
</body>
</html>
